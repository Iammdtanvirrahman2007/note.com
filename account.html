<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Note Messenger • Account</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at top,#3147a8,#111827 55%,#080b14);color:#fff;font-family:Inter,Arial,sans-serif}.card{width:min(430px,92vw);padding:30px;border:1px solid #ffffff22;border-radius:24px;background:#ffffff12;backdrop-filter:blur(18px);box-shadow:0 25px 80px #0008}.icon{text-align:center;font-size:48px}.card h1{text-align:center;margin:8px 0}.sub{text-align:center;color:#b8c0d9;font-size:14px;line-height:1.6}.card input{width:100%;padding:14px 16px;margin-top:10px;border:1px solid #ffffff22;border-radius:12px;background:#080b1499;color:#fff;outline:none;font-size:16px}.card button,.card a{display:block;width:100%;margin-top:12px;padding:14px;border:0;border-radius:12px;background:#5865f2;color:#fff;font-weight:700;font-size:15px;text-align:center;text-decoration:none;cursor:pointer}.card button.secondary,.card a.secondary{background:#ffffff14;border:1px solid #ffffff22}.card button:disabled{opacity:.6}.hint{margin-top:18px;color:#8f98b3;font-size:12px;text-align:center;line-height:1.5}#status{margin-top:12px;text-align:center;min-height:20px;color:#b9c6ff;line-height:1.5}</style></head><body><div class="card"><div class="icon">🔐</div><h1>Secure your account</h1><div class="sub" id="who">Checking your current account…</div><input id="password" type="password" minlength="8" autocomplete="new-password" placeholder="New password (8+ characters)"><input id="confirm" type="password" minlength="8" autocomplete="new-password" placeholder="Confirm password"><button id="save">Set Password</button><a class="secondary" href="app-v2.html">← Back to Messenger</a><div id="status"></div><div class="hint">This upgrades the current Firebase account instead of creating a new one, so your existing chats and UID stay intact.</div></div><script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";import{getAuth,EmailAuthProvider,linkWithCredential,onAuthStateChanged}from"https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js";import{getFirestore,doc,getDoc,setDoc,serverTimestamp}from"https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";
const config={apiKey:"AIzaSyBTDfFNbtXgf6I2OfwS_f6nCXLym2eSzc8",authDomain:"note-competition.firebaseapp.com",projectId:"note-competition",storageBucket:"note-competition.firebasestorage.app",messagingSenderId:"742140044633",appId:"1:742140044633:web:36cb08ff2aafc23c111848"};const app=initializeApp(config),auth=getAuth(app),db=getFirestore(app),p=document.getElementById("password"),c=document.getElementById("confirm"),btn=document.getElementById("save"),status=document.getElementById("status"),who=document.getElementById("who");const key=s=>s.trim().toLowerCase();const emailFor=n=>{const bytes=new TextEncoder().encode(key(n));let b="";bytes.forEach(x=>b+=String.fromCharCode(x));return btoa(b).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/g,"")+"@note-messenger.local"};function err(e){console.error(e);const x=e?.code||"";if(x.includes("operation-not-allowed"))return"Enable Email/Password in Firebase Authentication first.";if(x.includes("email-already-in-use"))return"This account already has a password. Log out and use nickname + password.";if(x.includes("credential-already-in-use"))return"That nickname/password credential is already attached to another account.";return"Could not set password: "+x}onAuthStateChanged(auth,async u=>{if(!u){who.textContent="No active Messenger session. Log in first, then open Account → Secure account.";btn.disabled=true;return}const s=await getDoc(doc(db,"users",u.uid));const d=s.exists()?s.data():{};who.textContent=`Signed in as ${d.nickname||"your account"}`;if(!u.isAnonymous){status.textContent="This account already uses password authentication. You can return to Messenger.";btn.disabled=true;return}btn.onclick=async()=>{const pw=p.value,cp=c.value;if(pw.length<8)return status.textContent="Password must be at least 8 characters.";if(pw!==cp)return status.textContent="Passwords do not match.";btn.disabled=true;status.textContent="Securing account…";try{const nickname=d.nickname||localStorage.getItem("nickname");if(!nickname)throw new Error("NICKNAME_MISSING");await linkWithCredential(u,EmailAuthProvider.credential(emailFor(nickname),pw));await setDoc(doc(db,"users",u.uid),{authMode:"password",lastSeen:serverTimestamp()},{merge:true});localStorage.setItem("authMode","password");status.textContent="✅ Password set successfully. Your UID and chats were preserved. You can now log out and log back in with nickname + password.";p.value=c.value=""}catch(e){status.textContent=e.message==="NICKNAME_MISSING"?"Nickname not found for this account.":err(e);btn.disabled=false}}});
</script></body></html>
