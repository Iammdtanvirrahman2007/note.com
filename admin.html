<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Note Messenger Admin</title><style>*{box-sizing:border-box}body{margin:0;background:#080c17;color:#edf1ff;font-family:Arial,sans-serif}.wrap{max-width:1180px;margin:25px auto;padding:0 12px}.card{background:#11182a;border:1px solid #ffffff14;border-radius:16px;padding:18px;margin:14px 0}.head,.actions{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}.btn{border:0;border-radius:9px;padding:10px 13px;background:#5865f2;color:white;font-weight:700;cursor:pointer}.btn:disabled{opacity:.6;cursor:wait}.red{background:#d94b5b}.green{background:#2f9e69}.gray{background:#202b45}.muted{color:#8f9ab6}.notice{display:none;margin-top:12px;padding:12px;border-radius:10px;background:#3a2026;color:#ffb8c0;white-space:pre-wrap}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:10px;text-align:left;border-bottom:1px solid #ffffff10}.pill{padding:4px 7px;border-radius:9px;background:#20304d;font-size:11px}.msg{background:#18233b;border-radius:11px;padding:12px;margin:8px 0}.msghead{display:flex;justify-content:space-between;gap:10px}.search{padding:11px;border-radius:9px;border:1px solid #ffffff18;background:#0d1425;color:white;width:300px;max-width:100%}.loginHint{font-size:12px;line-height:1.6;text-align:left;background:#0d1425;border-radius:10px;padding:12px;margin-top:14px;color:#aab4cc}@media(max-width:700px){.wrap{padding:0 8px}.table{font-size:12px}.table th:nth-child(2),.table td:nth-child(2){display:none}.msghead{flex-direction:column}}</style></head><body><div id="root"></div><script type="module">
import{initializeApp}from'https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js';import{getAuth,GoogleAuthProvider,signInWithPopup,onAuthStateChanged,signOut,setPersistence,browserLocalPersistence}from'https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js';import{getFirestore,collection,doc,getDocs,deleteDoc,updateDoc,query,orderBy,limit,serverTimestamp}from'https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js';
const cfg={apiKey:'AIzaSyBTDfFNbtXgf6I2OfwS_f6nCXLym2eSzc8',authDomain:'note-competition.firebaseapp.com',projectId:'note-competition',storageBucket:'note-competition.firebasestorage.app',messagingSenderId:'742140044633',appId:'1:742140044633:web:36cb08ff2aafc23c111848'},ADMIN='mdtanvirrahman2021a@gmail.com';const app=initializeApp(cfg),auth=getAuth(app),db=getFirestore(app),root=document.getElementById('root');let users=[],messages=[],opening=false;const esc=s=>String(s??'').replace(/[&<>\\'\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
const errText=e=>{console.error('Admin auth/error:',e);const c=e?.code||'';if(c==='auth/popup-closed-by-user')return'Google sign-in window was closed. Try again.';if(c==='auth/popup-blocked')return'Popup was blocked by Chrome. Allow popups for this site and try again.';if(c==='auth/unauthorized-domain')return'GitHub Pages domain is not authorized in Firebase Authentication.';if(c==='auth/invalid-credential'||c==='auth/operation-not-allowed')return'Google sign-in is not enabled/configured correctly in Firebase.';if(c==='auth/network-request-failed')return'Network error while contacting Firebase Authentication. Check internet and try again.';if(c==='auth/internal-error')return'Firebase returned an internal authentication error. Try once more after refreshing.';return e?.message||c||'Unknown error'};
function login(msg=''){root.innerHTML='<div class="card" style="max-width:470px;margin:12vh auto;text-align:center"><div style="font-size:55px">🛡️</div><h1>Admin Panel</h1><p class="muted">Sign in with the administrator Google account.</p><button class="btn" id="login">Continue with Google</button><p id="e" style="color:#ff9ca7;min-height:20px">'+(msg?'⚠️ '+esc(msg):'')+'</p><div class="loginHint"><b>Admin account</b><br>'+ADMIN+'<br><br>Popup authentication is used here because this site runs on GitHub Pages.</div></div>';document.getElementById('login').onclick=loginPopup}
async function loginPopup(){if(opening)return;opening=true;const b=document.getElementById('login'),e=document.getElementById('e');try{b.disabled=true;b.textContent='Opening Google…';e.textContent='';const p=new GoogleAuthProvider();p.setCustomParameters({prompt:'select_account'});const result=await signInWithPopup(auth,p);const email=String(result.user.email||'').toLowerCase();if(email!==ADMIN.toLowerCase()){await signOut(auth);throw Error('Wrong Google account. Please select '+ADMIN)}await panel()}catch(x){e.textContent='⚠️ '+errText(x);b.disabled=false;b.textContent='Continue with Google'}finally{opening=false}}
async function admin(){const u=auth.currentUser;if(!u||String(u.email||'').toLowerCase()!==ADMIN.toLowerCase())throw Error('Administrator Google account required.');await u.getIdToken(true);return u}function notice(e){const n=document.getElementById('notice');if(n){n.textContent='⚠️ '+errText(e);n.style.display='block'}else alert(errText(e))}
async function usersLoad(){await admin();const s=await getDocs(collection(db,'users'));users=s.docs.map(x=>({id:x.id,...x.data()}));renderUsers()}function renderUsers(){const b=document.getElementById('users');if(!b)return;const q=(document.getElementById('userSearch')?.value||'').toLowerCase();b.innerHTML='';users.filter(u=>(u.nickname||'').toLowerCase().includes(q)).sort((a,b)=>(a.nickname||'').localeCompare(b.nickname||'')).forEach(u=>{const r=document.createElement('tr');r.innerHTML=`<td><b>${esc(u.nickname)}</b> ${u.kicked?'<span class="pill">KICKED</span>':''}</td><td>${esc(u.uid)}</td><td><div class="actions"><button class="btn ${u.kicked?'green':'red'}" data-k="${u.id}">${u.kicked?'Restore':'Kick'}</button>${u.uid!==auth.currentUser.uid?`<button class="btn gray" data-d="${u.id}">Delete</button>`:''}</div></td>`;b.appendChild(r)});b.querySelectorAll('[data-k]').forEach(x=>x.onclick=()=>kick(x.dataset.k));b.querySelectorAll('[data-d]').forEach(x=>x.onclick=()=>profileDelete(x.dataset.d))}async function kick(id){const u=users.find(x=>x.id===id);if(!u||!confirm(`${u.kicked?'Restore':'Kick'} ${u.nickname}?`))return;try{await admin();await updateDoc(doc(db,'users',id),{kicked:!u.kicked});await usersLoad()}catch(e){notice(e)}}async function profileDelete(id){const u=users.find(x=>x.id===id);if(!u||!confirm(`Delete ${u.nickname}'s profile?`))return;try{await admin();await deleteDoc(doc(db,'users',id));await usersLoad()}catch(e){notice(e)}}
async function groupLoad(){try{await admin();const s=await getDocs(query(collection(db,'chats','global','messages'),orderBy('createdAt','desc'),limit(200)));messages=s.docs.map(x=>({id:x.id,chatId:'global',...x.data()}));renderMsgs()}catch(e){notice(e)}}async function privateLoad(){try{await admin();const cs=await getDocs(collection(db,'chats')),out=[];for(const c of cs.docs){if(c.id==='global')continue;const s=await getDocs(query(collection(db,'chats',c.id,'messages'),orderBy('createdAt','desc'),limit(100)));s.docs.forEach(x=>out.push({id:x.id,chatId:c.id,...x.data()}))}messages=out.sort((a,b)=>(b.createdAt?.seconds||0)-(a.createdAt?.seconds||0)).slice(0,300);renderMsgs()}catch(e){notice(e)}}function renderMsgs(){const box=document.getElementById('msgs');if(!box)return;box.innerHTML=messages.length?'':'<p class="muted">No messages found.</p>';messages.forEach(m=>{const d=document.createElement('div');d.className='msg';d.innerHTML=`<div class="msghead"><b>${esc(m.senderName||'Unknown')}</b><div class="actions"><button class="btn gray" data-e="${m.chatId}/${m.id}">Edit</button><button class="btn red" data-x="${m.chatId}/${m.id}">Delete</button></div></div><small class="muted">${esc(m.chatId)}</small><div style="white-space:pre-wrap;margin-top:6px">${esc(m.text||'')}</div>`;box.appendChild(d)});box.querySelectorAll('[data-e]').forEach(x=>x.onclick=()=>edit(x.dataset.e));box.querySelectorAll('[data-x]').forEach(x=>x.onclick=()=>del(x.dataset.x))}async function edit(path){const [c,id]=path.split('/'),m=messages.find(x=>x.chatId===c&&x.id===id);if(!m)return;const t=prompt('Edit message:',m.text||'');if(t===null||!t.trim())return;try{await admin();await updateDoc(doc(db,'chats',c,'messages',id),{text:t.trim(),edited:true,editedAt:serverTimestamp()});m.text=t.trim();renderMsgs()}catch(e){notice(e)}}async function del(path){const [c,id]=path.split('/');if(!confirm('Delete this message for everyone?'))return;try{await admin();await deleteDoc(doc(db,'chats',c,'messages',id));messages=messages.filter(m=>!(m.chatId===c&&m.id===id));renderMsgs()}catch(e){notice(e)}}async function clearGroup(){if(!confirm('Delete latest 200 group messages?'))return;try{await admin();const s=await getDocs(query(collection(db,'chats','global','messages'),limit(200)));await Promise.all(s.docs.map(x=>deleteDoc(x.ref)));await groupLoad()}catch(e){notice(e)}}async function clearAllMessages(){if(!confirm('⚠️ Delete ALL messages from the global chat and every private chat?\n\nThis cannot be undone. Users and nicknames will NOT be deleted.'))return;const btn=document.getElementById('ca');try{await admin();if(btn){btn.disabled=true;btn.textContent='Clearing…'}const cs=await getDocs(collection(db,'chats'));let total=0;for(const c of cs.docs){const s=await getDocs(collection(db,'chats',c.id,'messages'));if(s.empty)continue;await Promise.all(s.docs.map(x=>deleteDoc(x.ref)));total+=s.size}messages=[];renderMsgs();if(btn){btn.disabled=false;btn.textContent='Clear ALL messages'}alert(`✅ Cleared ${total} message(s) from all chats.`)}catch(e){if(btn){btn.disabled=false;btn.textContent='Clear ALL messages'}notice(e)}}
async function panel(){root.innerHTML='<div class="wrap"><div class="card"><div class="head"><div><h1 style="margin:0">🛡️ God Mode Admin</h1><span class="muted">'+ADMIN+'</span></div><div class="actions"><button class="btn gray" id="home">Messenger</button><button class="btn red" id="logout">Logout</button></div></div><div id="notice" class="notice"></div></div><div class="card"><div class="head"><h2>👥 Users</h2><input id="userSearch" class="search" placeholder="Search nickname"></div><div style="overflow:auto"><table class="table"><thead><tr><th>Nickname</th><th>UID</th><th>Actions</th></tr></thead><tbody id="users"></tbody></table></div></div><div class="card"><div class="head"><h2>🧹 Messages</h2><div class="actions"><button class="btn gray" id="gm">Group messages</button><button class="btn gray" id="pm">Private messages</button><button class="btn red" id="cg">Clear group</button><button class="btn red" id="ca">Clear ALL messages</button></div></div><div id="msgs"></div></div></div>';document.getElementById('userSearch').oninput=renderUsers;document.getElementById('gm').onclick=groupLoad;document.getElementById('pm').onclick=privateLoad;document.getElementById('cg').onclick=clearGroup;document.getElementById('ca').onclick=clearAllMessages;document.getElementById('logout').onclick=async()=>{await signOut(auth);login()};document.getElementById('home').onclick=()=>location.href='app-v2.html';try{await usersLoad();await groupLoad()}catch(e){notice(e)}}
await setPersistence(auth,browserLocalPersistence).catch(console.error);onAuthStateChanged(auth,u=>{if(u&&String(u.email||'').toLowerCase()===ADMIN.toLowerCase()){if(!document.getElementById('users'))panel()}else if(!u)login();else{signOut(auth).finally(()=>login('Wrong Google account.'))}});</script></body></html>
