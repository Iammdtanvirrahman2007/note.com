<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Note Messenger • Admin</title><style>*{box-sizing:border-box}body{margin:0;background:#080c17;color:#edf1ff;font-family:Inter,Arial,sans-serif}.wrap{width:min(1180px,94vw);margin:28px auto}.card{background:#11182a;border:1px solid #ffffff12;border-radius:16px;padding:18px;margin-bottom:16px}.login{max-width:430px;margin:12vh auto;text-align:center}.h{display:flex;justify-content:space-between;align-items:center;gap:12px}.muted{color:#8f9ab6}.btn{border:0;border-radius:9px;padding:10px 13px;background:#5865f2;color:#fff;font-weight:700;cursor:pointer}.btn.red{background:#d94b5b}.btn.gray{background:#202b45}.btn.green{background:#2f9e69}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.stat{padding:16px;border-radius:12px;background:#18233b}.stat b{font-size:26px;display:block}.table{width:100%;border-collapse:collapse}.table th,.table td{text-align:left;padding:11px;border-bottom:1px solid #ffffff10;vertical-align:middle}.pill{display:inline-block;padding:4px 8px;border-radius:99px;background:#20304d;color:#b8c7e8;font-size:11px}.danger{color:#ff9aa5}.msg{padding:12px;border-radius:10px;background:#18233b;margin:8px 0}.msgHead{display:flex;justify-content:space-between;gap:10px}.msgText{margin-top:6px;word-break:break-word}.actions{display:flex;gap:6px;flex-wrap:wrap}.search{width:100%;padding:12px;background:#0d1425;border:1px solid #ffffff14;color:#fff;border-radius:10px;outline:none}@media(max-width:760px){.grid{grid-template-columns:1fr}.table{font-size:13px}.wrap{width:96vw}.table th:nth-child(3),.table td:nth-child(3){display:none}}</style></head><body><div id="root"></div><script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";import {getAuth,GoogleAuthProvider,signInWithPopup,onAuthStateChanged,signOut} from "https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js";import {getFirestore,collection,doc,getDocs,deleteDoc,updateDoc,query,orderBy,limit} from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";
const config={apiKey:"AIzaSyBTDfFNbtXgf6I2OfwS_f6nCXLym2eSzc8",authDomain:"note-competition.firebaseapp.com",projectId:"note-competition",storageBucket:"note-competition.firebasestorage.app",messagingSenderId:"742140044633",appId:"1:742140044633:web:36cb08ff2aafc23c111848"},ADMIN_EMAIL="mdtanvirrahman2021a@gmail.com";const app=initializeApp(config),auth=getAuth(app),db=getFirestore(app),root=document.getElementById("root");let users=[],messages=[];const esc=s=>String(s??"").replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
function loginUI(){root.innerHTML='<div class="card login"><div style="font-size:54px">🛡️</div><h1>Admin Panel</h1><p class="muted">Sign in with the administrator Google account.</p><button class="btn" id="google">Continue with Google</button><p id="err" class="danger"></p><a class="muted" href="index.html">← Back to Messenger</a></div>';document.getElementById("google").onclick=async()=>{try{const c=await signInWithPopup(auth,new GoogleAuthProvider());if((c.user.email||"").toLowerCase()!==ADMIN_EMAIL){await signOut(auth);document.getElementById("err").textContent="This Google account is not the administrator.";return}renderAdmin()}catch(e){console.error(e);document.getElementById("err").textContent=e.code||e.message}}}
async function loadUsers(){const s=await getDocs(collection(db,"users"));users=s.docs.map(x=>({id:x.id,...x.data()}));document.getElementById("userCount").textContent=users.length;renderUsers()}function renderUsers(){const q=(document.getElementById("userSearch")?.value||"").toLowerCase(),body=document.getElementById("usersBody");body.innerHTML="";users.filter(u=>(u.nickname||"").toLowerCase().includes(q)).sort((a,b)=>(a.nickname||"").localeCompare(b.nickname||"")).forEach(u=>{const tr=document.createElement("tr");tr.innerHTML=`<td><b>${esc(u.nickname)}</b>${u.kicked?'<span class="pill danger"> KICKED</span>':''}</td><td><span class="pill">${esc(u.uid)}</span></td><td>${u.uid===auth.currentUser?.uid?'<span class="pill">ADMIN</span>':''}</td><td><div class="actions"><button class="btn ${u.kicked?'green':'red'}" data-kick="${u.id}">${u.kicked?'Restore':'Kick'}</button>${u.uid!==auth.currentUser?.uid?`<button class="btn gray" data-deluser="${u.id}">Delete profile</button>`:''}</div></td>`;body.appendChild(tr)});body.querySelectorAll('[data-kick]').forEach(b=>b.onclick=()=>toggleKick(b.dataset.kick));body.querySelectorAll('[data-deluser]').forEach(b=>b.onclick=()=>deleteProfile(b.dataset.deluser))}async function toggleKick(id){const u=users.find(x=>x.id===id);if(!u||!confirm(`${u.kicked?'Restore':'Kick'} ${u.nickname}?`))return;await updateDoc(doc(db,"users",id),{kicked:!u.kicked});await loadUsers()}async function deleteProfile(id){const u=users.find(x=>x.id===id);if(!u||!confirm(`Delete profile ${u.nickname}?`))return;await deleteDoc(doc(db,"users",id));await loadUsers()}
async function loadGroupMessages(){const s=await getDocs(query(collection(db,"chats","global","messages"),orderBy("createdAt","desc"),limit(200)));messages=s.docs.map(x=>({id:x.id,...x.data(),chatId:"global"}));renderMessages()}async function loadPrivateMessages(){const chats=await getDocs(collection(db,"chats")),out=[];for(const c of chats.docs){if(c.id==="global")continue;const ms=await getDocs(query(collection(db,"chats",c.id,"messages"),orderBy("createdAt","desc"),limit(100)));ms.docs.forEach(x=>out.push({id:x.id,...x.data(),chatId:c.id}))}messages=out.slice(0,300);renderMessages()}function renderMessages(){const box=document.getElementById("messagesBox");box.innerHTML="";if(!messages.length){box.innerHTML='<div class="muted">No messages found.</div>';return}messages.forEach(m=>{const el=document.createElement("div");el.className="msg";el.innerHTML=`<div class="msgHead"><b>${esc(m.senderName||"Unknown")}</b><button class="btn red" data-delmsg="${m.chatId}/${m.id}">Delete</button></div><div class="muted" style="font-size:11px">Chat: ${esc(m.chatId)}</div><div class="msgText">${esc(m.text||"")}</div>`;box.appendChild(el)});box.querySelectorAll('[data-delmsg]').forEach(b=>b.onclick=()=>deleteMessage(b.dataset.delmsg))}async function deleteMessage(path){const [chatId,id]=path.split("/");if(!confirm("Delete this message?"))return;await deleteDoc(doc(db,"chats",chatId,"messages",id));messages=messages.filter(m=>!(m.chatId===chatId&&m.id===id));renderMessages()}async function clearGroup(){if(!confirm("Delete the latest 200 group messages?"))return;const s=await getDocs(query(collection(db,"chats","global","messages"),limit(200)));await Promise.all(s.docs.map(x=>deleteDoc(x.ref)));await loadGroupMessages()}
async function renderAdmin(){root.innerHTML='<div class="wrap"><div class="card"><div class="h"><div><h1 style="margin:0">🛡️ God Mode Admin</h1><div class="muted">Administrator: '+esc(ADMIN_EMAIL)+'</div></div><div class="actions"><button class="btn gray" id="home">Messenger</button><button class="btn red" id="logout">Logout</button></div></div></div><div class="grid"><div class="stat"><span class="muted">Users</span><b id="userCount">0</b></div><div class="stat"><span class="muted">Admin powers</span><b>FULL</b></div><div class="stat"><span class="muted">Nickname policy</span><b>UNIQUE</b></div></div><div class="card"><div class="h"><h2>👥 Users</h2><input id="userSearch" class="search" style="max-width:320px" placeholder="Search nickname"></div><div style="overflow:auto;margin-top:10px"><table class="table"><thead><tr><th>Nickname</th><th>UID</th><th>Role</th><th>Actions</th></tr></thead><tbody id="usersBody"></tbody></table></div></div><div class="card"><div class="h"><h2>🧹 Message Playground</h2><div class="actions"><button class="btn gray" id="groupMsgs">Group messages</button><button class="btn gray" id="privateMsgs">Private messages</button><button class="btn red" id="clearGroup">Clear group</button></div></div><div id="messagesBox" style="margin-top:12px"></div></div></div>';document.getElementById("userSearch").oninput=renderUsers;document.getElementById("groupMsgs").onclick=loadGroupMessages;document.getElementById("privateMsgs").onclick=loadPrivateMessages;document.getElementById("clearGroup").onclick=clearGroup;document.getElementById("logout").onclick=async()=>{await signOut(auth);loginUI()};document.getElementById("home").onclick=()=>location.href="app-v2.html";await loadUsers();await loadGroupMessages()}
onAuthStateChanged(auth,u=>{if(!u)loginUI();else if((u.email||"").toLowerCase()===ADMIN_EMAIL)renderAdmin();else loginUI()});</script></body></html>
