<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Note Messenger • Login</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;font-family:Inter,Arial,sans-serif;background:radial-gradient(circle at top,#3147a8,#111827 55%,#080b14);color:#fff}.login{width:min(420px,92vw);padding:34px;border:1px solid #ffffff22;border-radius:24px;background:#ffffff12;backdrop-filter:blur(18px);box-shadow:0 25px 80px #0008}.logo{font-size:48px;text-align:center}.login h1{text-align:center;margin:8px 0 6px}.login p{text-align:center;color:#b8c0d9;margin:0 0 25px}.login input{width:100%;padding:14px 16px;border:1px solid #ffffff22;border-radius:12px;background:#080b1499;color:#fff;outline:none;font-size:16px}.login button{width:100%;margin-top:12px;padding:14px;border:0;border-radius:12px;background:#5865f2;color:white;font-weight:700;font-size:16px;cursor:pointer}.login button:hover{filter:brightness(1.1)}.login button:disabled{opacity:.6;cursor:wait}#error{color:#ff9b9b;text-align:center;min-height:20px;margin-top:12px;font-size:14px;line-height:1.5}.hint{text-align:center;color:#8f98b3;font-size:12px;margin-top:18px}.adminLink{display:block;text-align:center;margin-top:16px;color:#aebaff;font-size:13px;text-decoration:none}.adminLink:hover{text-decoration:underline}</style></head><body><div class="login"><div class="logo">💬</div><h1>Note Messenger</h1><p>Chat with people using only a nickname.</p><input id="nickname" maxlength="24" autocomplete="off" placeholder="Choose a nickname"><button id="loginBtn">Enter Messenger</button><div id="error"></div><a class="adminLink" href="admin.html">🛡️ Admin Panel</a><div class="hint">No Google account • No email • No password</div></div>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";import {getAuth,signInAnonymously} from "https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js";import {getFirestore,doc,getDocs,query,where,limit,runTransaction,serverTimestamp,collection} from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";
const firebaseConfig={apiKey:"AIzaSyBTDfFNbtXgf6I2OfwS_f6nCXLym2eSzc8",authDomain:"note-competition.firebaseapp.com",projectId:"note-competition",storageBucket:"note-competition.firebasestorage.app",messagingSenderId:"742140044633",appId:"1:742140044633:web:36cb08ff2aafc23c111848"};const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app);if(localStorage.getItem("nickname")&&localStorage.getItem("uid"))location.href="app-v2.html";const input=document.getElementById("nickname"),error=document.getElementById("error"),btn=document.getElementById("loginBtn"),key=s=>s.trim().toLowerCase();function friendlyError(e){console.error(e);const c=e?.code||e?.message||"unknown";if(String(c).includes("operation-not-allowed"))return"Anonymous Authentication is disabled. Enable Anonymous in Firebase Console.";if(String(c).includes("permission-denied"))return"Firestore permission denied. Check the Firestore Rules.";if(String(c).includes("network-request-failed"))return"Network error. Check your internet connection.";return`Login error: ${c}`}async function login(){const nickname=input.value.trim();if(nickname.length<2)return error.textContent="Nickname must be at least 2 characters.";if(!/^[a-zA-Z0-9_ .-]+$/.test(nickname))return error.textContent="Use letters, numbers, spaces, _ . or - only.";btn.disabled=true;btn.textContent="Entering…";error.textContent="";try{const cred=await signInAnonymously(auth),uid=cred.user.uid,nk=key(nickname),nickRef=doc(db,"nicknames",nk),userRef=doc(db,"users",uid);const old=await getDocs(query(collection(db,"users"),where("nicknameLower","==",nk),limit(1))).catch(()=>null);if(old&&!old.empty&&old.docs[0].id!==uid)throw new Error("NICKNAME_TAKEN");await runTransaction(db,async tx=>{const [nickSnap,userSnap]=await Promise.all([tx.get(nickRef),tx.get(userRef)]);if(nickSnap.exists()&&nickSnap.data().uid!==uid)throw new Error("NICKNAME_TAKEN");if(userSnap.exists()&&userSnap.data().kicked===true)throw new Error("KICKED");tx.set(nickRef,{uid,nickname,updatedAt:serverTimestamp()},{merge:true});tx.set(userRef,userSnap.exists()?{nickname,nicknameLower:nk,uid,lastSeen:serverTimestamp()}:{nickname,nicknameLower:nk,uid,createdAt:serverTimestamp(),lastSeen:serverTimestamp(),kicked:false},{merge:true})});localStorage.setItem("nickname",nickname);localStorage.setItem("uid",uid);location.href="app-v2.html"}catch(e){error.textContent=e.message==="NICKNAME_TAKEN"?"That nickname is already in use. Choose another one.":e.message==="KICKED"?"This account has been kicked by the administrator.":friendlyError(e);btn.disabled=false;btn.textContent="Enter Messenger"}}btn.onclick=login;input.onkeydown=e=>{if(e.key==="Enter")login()};
</script></body></html>
