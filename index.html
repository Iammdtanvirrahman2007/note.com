<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Note Messenger • Login</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;font-family:Inter,Arial,sans-serif;background:radial-gradient(circle at top,#3147a8,#111827 55%,#080b14);color:#fff}.login{width:min(420px,92vw);padding:34px;border:1px solid #ffffff22;border-radius:24px;background:#ffffff12;backdrop-filter:blur(18px);box-shadow:0 25px 80px #0008}.logo{font-size:48px;text-align:center}.login h1{text-align:center;margin:8px 0 6px}.login p{text-align:center;color:#b8c0d9;margin:0 0 25px}.login input{width:100%;padding:14px 16px;margin-top:10px;border:1px solid #ffffff22;border-radius:12px;background:#080b1499;color:#fff;outline:none;font-size:16px}.login button{width:100%;margin-top:12px;padding:14px;border:0;border-radius:12px;background:#5865f2;color:white;font-weight:700;font-size:16px;cursor:pointer}.login button.secondary{background:#ffffff14;border:1px solid #ffffff22}.login button:hover{filter:brightness(1.1)}.login button:disabled{opacity:.6;cursor:wait}#error{color:#ff9b9b;text-align:center;min-height:20px;margin-top:12px;font-size:14px;line-height:1.5}.hint{text-align:center;color:#8f98b3;font-size:12px;margin-top:18px}.adminLink{display:block;text-align:center;margin-top:16px;color:#aebaff;font-size:13px;text-decoration:none}.adminLink:hover{text-decoration:underline}</style></head><body><div class="login"><div class="logo">💬</div><h1>Note Messenger</h1><p>Use your nickname and password to enter.</p><input id="nickname" maxlength="24" autocomplete="username" placeholder="Nickname"><input id="password" type="password" minlength="8" autocomplete="current-password" placeholder="Password (8+ characters)"><button id="loginBtn">Login</button><button id="createBtn" class="secondary">Create Account</button><div id="error"></div><a class="adminLink" href="admin.html">🛡️ Admin Panel</a><div class="hint">Your password is handled by Firebase Authentication and is never stored in Firestore or localStorage.</div></div>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";import{getAuth,signInWithEmailAndPassword,createUserWithEmailAndPassword}from"https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js";import{getFirestore,doc,getDoc,getDocs,query,where,limit,runTransaction,serverTimestamp,collection}from"https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";
const firebaseConfig={apiKey:"AIzaSyBTDfFNbtXgf6I2OfwS_f6nCXLym2eSzc8",authDomain:"note-competition.firebaseapp.com",projectId:"note-competition",storageBucket:"note-competition.firebasestorage.app",messagingSenderId:"742140044633",appId:"1:742140044633:web:36cb08ff2aafc23c111848"};const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app),input=document.getElementById("nickname"),pass=document.getElementById("password"),error=document.getElementById("error"),loginBtn=document.getElementById("loginBtn"),createBtn=document.getElementById("createBtn");const key=s=>s.trim().toLowerCase();const emailFor=n=>{const bytes=new TextEncoder().encode(key(n));let b="";bytes.forEach(x=>b+=String.fromCharCode(x));return btoa(b).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/g,"")+"@note-messenger.local"};function friendly(e){console.error(e);const c=e?.code||"";if(c.includes("operation-not-allowed"))return"Email/Password authentication is disabled. Enable it in Firebase Console → Authentication → Sign-in method.";if(c.includes("invalid-credential")||c.includes("wrong-password")||c.includes("user-not-found"))return"Wrong nickname or password.";if(c.includes("email-already-in-use"))return"This nickname already has a password account. Use Login.";if(c.includes("weak-password"))return"Use a password with at least 8 characters.";if(c.includes("network-request-failed"))return"Network error. Check your internet connection.";return"Authentication error: "+c}async function finish(user,nickname){const s=await getDoc(doc(db,"users",user.uid));if(!s.exists())throw new Error("ACCOUNT_NOT_FOUND");const d=s.data();if(d.kicked===true)throw new Error("KICKED");if(d.nicknameLower!==key(nickname))throw new Error("NICKNAME_MISMATCH");localStorage.setItem("nickname",d.nickname);localStorage.setItem("uid",user.uid);localStorage.setItem("authMode","password");location.href="app-v2.html"}async function login(){const n=input.value.trim(),p=pass.value;if(n.length<2)return error.textContent="Nickname must be at least 2 characters.";if(!/^[a-zA-Z0-9_ .-]+$/.test(n))return error.textContent="Use letters, numbers, spaces, _ . or - only.";if(p.length<8)return error.textContent="Password must be at least 8 characters.";loginBtn.disabled=createBtn.disabled=true;error.textContent="";try{const c=await signInWithEmailAndPassword(auth,emailFor(n),p);await finish(c.user,n)}catch(e){error.textContent=e.message==="KICKED"?"This account has been kicked by the administrator.":e.message==="NICKNAME_MISMATCH"?"That nickname does not match this account.":e.message==="ACCOUNT_NOT_FOUND"?"Account data is missing. Contact the admin.":friendly(e);loginBtn.disabled=createBtn.disabled=false}}async function create(){const n=input.value.trim(),p=pass.value;if(n.length<2)return error.textContent="Nickname must be at least 2 characters.";if(!/^[a-zA-Z0-9_ .-]+$/.test(n))return error.textContent="Use letters, numbers, spaces, _ . or - only.";if(p.length<8)return error.textContent="Password must be at least 8 characters.";loginBtn.disabled=createBtn.disabled=true;error.textContent="";try{const existing=await getDocs(query(collection(db,"users"),where("nicknameLower","==",key(n)),limit(1)));if(!existing.empty)throw new Error("NICKNAME_TAKEN");const c=await createUserWithEmailAndPassword(auth,emailFor(n),p),u=c.user;await runTransaction(db,async tx=>{const nr=doc(db,"nicknames",key(n)),ur=doc(db,"users",u.uid),ns=await tx.get(nr);if(ns.exists()&&ns.data().uid!==u.uid)throw new Error("NICKNAME_TAKEN");tx.set(nr,{uid:u.uid,nickname:n,updatedAt:serverTimestamp()},{merge:true});tx.set(ur,{uid:u.uid,nickname:n,nicknameLower:key(n),createdAt:serverTimestamp(),lastSeen:serverTimestamp(),kicked:false,authMode:"password"},{merge:true})});localStorage.setItem("nickname",n);localStorage.setItem("uid",u.uid);localStorage.setItem("authMode","password");location.href="app-v2.html"}catch(e){error.textContent=e.message==="NICKNAME_TAKEN"?"That nickname is already in use. Use Login or choose another nickname.":friendly(e);loginBtn.disabled=createBtn.disabled=false}}loginBtn.onclick=login;createBtn.onclick=create;input.onkeydown=e=>{if(e.key==="Enter")login()};pass.onkeydown=e=>{if(e.key==="Enter")login()};const saved=localStorage.getItem("nickname");if(saved)input.value=saved;
</script></body></html>
