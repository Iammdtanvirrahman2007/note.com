<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Tanmira Chat</title>
<link rel="stylesheet" href="css/messenger.css">
</head>
<body>
<div class="app" id="app">
<aside class="sidebar" id="sidebar">
 <div class="sideHead">
  <div class="brandLine">
   <div class="brand">Tanmira Chat</div>
   <div class="brandBtns">
    <button class="circleBtn" id="newChat" title="New chat">✎</button>
    <button class="circleBtn" id="mediaBtn" title="Media">🖼️</button>
    <button class="circleBtn" id="themeHome" title="Theme">🎨</button>
    <details class="moreMenu">
     <summary class="circleBtn" title="Menu">☰</summary>
     <div class="moreMenuPanel">
      <a href="account.html">🔐 Account &amp; Password</a>
      <a href="admin.html">🛡️ Admin Panel</a>
      <button id="logout" class="logout">🚪 Logout</button>
     </div>
    </details>
   </div>
  </div>
  <div class="search"><input id="search" placeholder="🔎 Search chats"></div>
 </div>
 <div class="online" id="online" aria-hidden="true"></div>
 <div class="chatList" id="chatList"><div class="empty">Loading chats…</div></div>
</aside>
<main class="main" id="main">
 <header class="top"><div class="topLeft"><button class="iconBtn backBtn" id="back">‹</button><div id="topAvatar" class="topAvatar">👥</div><div><h2 id="title">Everyone</h2><small id="subtitle">Group chat</small></div></div><button class="iconBtn" id="themeBtn">🎨 <span class="themeText">Theme</span></button></header>
 <section class="content">
  <div id="chatView" style="display:flex;flex:1;min-height:0;flex-direction:column"><div class="messages" id="messages"><div class="empty">Choose a chat to start messaging.</div></div><div class="composer" id="composer"><button id="attachFile" class="iconBtn" title="Send image or file" type="button">📎</button><input id="message" maxlength="2000" autocomplete="off" placeholder="Message everyone…"><button id="send">Send</button></div></div>
  <div id="mediaView" class="mediaView"><div class="empty">Google Drive media is loading…</div></div>
 </section>
</main>
</div>
<div class="menuModal" id="rowMenuBack"><div class="actionSheet" id="rowMenu"></div></div>
<div class="modal" id="themeModal"><div class="modalCard"><div class="modalHead"><h3>🎨 Personal Chat Theme</h3><button class="close" id="closeTheme">✕</button></div><p style="color:#8f9ab6;font-size:12px">Only you see this theme. It is saved on this device.</p><div class="presets"><button class="preset" data-t="midnight" style="background:#202633">Midnight</button><button class="preset" data-t="ocean" style="background:#123b56">Ocean</button><button class="preset" data-t="forest" style="background:#173d32">Forest</button><button class="preset" data-t="sunset" style="background:#4b2b25">Sunset</button><button class="preset" data-t="rose" style="background:#4b2638">Rose</button><button class="preset" data-t="lavender" style="background:#38305b">Lavender</button></div><div class="colors"><div class="colorBox"><label>Chat bubble</label><input type="color" id="bubbleColor"></div><div class="colorBox"><label>Message text</label><input type="color" id="textColor"></div><div class="colorBox"><label>My bubble</label><input type="color" id="mineColor"></div><div class="colorBox"><label>Accent</label><input type="color" id="accentColor"></div></div><div class="hint">Theme settings are personal and stored on this device.</div></div></div>
<script>
document.addEventListener('click',function(e){const menu=document.querySelector('.moreMenu');if(menu && !menu.contains(e.target)) menu.removeAttribute('open');});
</script>
<script type="module" src="js/messenger.js"></script>
<script type="module" src="js/drive-files.js"></script>
</body>
</html>
