<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Note Messenger</title>
<style>
*{box-sizing:border-box}body{margin:0;height:100vh;font-family:Inter,Arial,sans-serif;background:#0b1020;color:#e9edf7;overflow:hidden}.app{height:100vh;display:grid;grid-template-columns:300px 1fr}.sidebar{background:#11182b;border-right:1px solid #ffffff12;display:flex;flex-direction:column}.brand{padding:18px 20px;font-size:20px;font-weight:800;border-bottom:1px solid #ffffff12}.me{padding:14px 18px;border-bottom:1px solid #ffffff12;color:#b9c2d9;font-size:13px}.me b{color:#fff}.sideBtns{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:12px}.sideBtns button{border:0;border-radius:9px;padding:10px;background:#1d2741;color:#dfe6fb;cursor:pointer}.sideBtns button.active{background:#5865f2;color:white}.users{overflow:auto;padding:4px 10px}.user{display:flex;align-items:center;gap:10px;padding:11px;border-radius:10px;cursor:pointer}.user:hover,.user.selected{background:#1c2742}.avatar{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:#5865f2;color:#fff;font-weight:800}.uinfo{min-width:0}.uinfo b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.uinfo small{color:#7f8aa8}.main{min-width:0;display:flex;flex-direction:column;background:#0d1425}.top{height:64px;border-bottom:1px solid #ffffff12;display:flex;align-items:center;justify-content:space-between;padding:0 20px}.top h2{font-size:17px;margin:0}.topActions button{border:0;background:#18223a;color:#dce4f8;border-radius:9px;padding:9px 12px;margin-left:6px;cursor:pointer}.content{flex:1;min-height:0;display:flex;flex-direction:column}.messages{flex:1;overflow:auto;padding:22px;display:flex;flex-direction:column;gap:9px}.bubble{max-width:min(70%,650px);padding:10px 13px;border-radius:15px;background:#1b2640;align-self:flex-start;word-break:break-word}.bubble.mine{background:#5865f2;align-self:flex-end}.bubble small{display:block;opacity:.65;font-size:10px;margin-top:5px}.composer{display:flex;gap:9px;padding:14px;border-top:1px solid #ffffff12}.composer input{flex:1;min-width:0;background:#141e35;border:1px solid #ffffff10;color:#fff;padding:13px 15px;border-radius:12px;outline:none}.composer button{border:0;border-radius:12px;padding:0 18px;background:#5865f2;color:#fff;font-weight:700;cursor:pointer}.empty{margin:auto;text-align:center;color:#7e89a7}.media{padding:22px;overflow:auto;display:none}.media h2{margin-top:0}.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px}.photo{background:#141e35;border-radius:14px;overflow:hidden;border:1px solid #ffffff0d}.photo img{width:100%;aspect-ratio:1;object-fit:cover;display:block}.photo div{padding:9px;font-size:12px;color:#9faac2}.notice{padding:12px;border-radius:10px;background:#17223a;color:#aeb9d1;margin-bottom:15px}.logout{color:#ff9b9b!important}.mobileUsers{display:none}
@media(max-width:760px){.app{grid-template-columns:1fr}.sidebar{position:fixed;z-index:5;width:280px;height:100%;transform:translateX(-100%);transition:.2s}.sidebar.open{transform:translateX(0)}.mobileUsers{display:inline-block!important}.bubble{max-width:84%}}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar" id="sidebar">
  <div class="brand">💬 Note Messenger</div>
  <div class="me">Signed in as <b id="myName"></b></div>
  <div class="sideBtns"><button id="chatTab" class="active">💬 Chats</button><button id="mediaTab">🖼️ Media</button></div>
  <div id="users" class="users"></div>
  <div style="padding:12px;margin-top:auto"><button class="user logout" id="logout" style="width:100%;border:0;background:transparent">🚪 Logout</button></div>
</aside>
<main class="main">
  <header class="top"><div><button class="topActions mobileUsers" id="menu">☰</button> <span id="title">Select someone to chat</span></div><div class="topActions"><button id="refreshMedia" style="display:none">↻ Refresh</button></div></header>
  <section class="content">
    <div id="chatView" style="display:flex;flex:1;min-height:0;flex-direction:column">
      <div id="messages" class="messages"><div class="empty">👋 Pick a person from the left to start chatting.</div></div>
      <div class="composer"><input id="message" maxlength="2000" placeholder="Write a message…"><button id="send">Send</button></div>
    </div>
    <div id="mediaView" class="media"><div class="notice">📁 Images are loaded automatically from the repository's <b>media/</b> folder. Upload an image there on GitHub, then press Refresh.</div><div id="gallery" class="gallery"></div></div>
  </section>
</main>
</div>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
import {getAuth,signInAnonymously,onAuthStateChanged} from "https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js";
import {getFirestore,collection,doc,setDoc,addDoc,query,orderBy,onSnapshot,serverTimestamp,where,getDocs} from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";
const config={apiKey:"AIzaSyBTDfFNbtXgf6I2OfwS_f6nCXLym2eSzc8",authDomain:"note-competition.firebaseapp.com",projectId:"note-competition",storageBucket:"note-competition.firebasestorage.app",messagingSenderId:"742140044633",appId:"1:742140044633:web:36cb08ff2aafc23c111848"};
const app=initializeApp(config),auth=getAuth(app),db=getFirestore(app);const uid=localStorage.getItem("uid"),nickname=localStorage.getItem("nickname");
if(!uid||!nickname) location.href="index.html";
document.getElementById("myName").textContent=nickname;
let selected=null,unsubscribeMessages=null;
const usersEl=document.getElementById("users"),messagesEl=document.getElementById("messages"),input=document.getElementById("message");
function avatar(n){return (n||"?").trim().charAt(0).toUpperCase()}
function renderUsers(list){usersEl.innerHTML="";list.filter(u=>u.uid!==uid).sort((a,b)=>(a.nickname||"").localeCompare(b.nickname||"")).forEach(u=>{const el=document.createElement("div");el.className="user"+(selected?.uid===u.uid?" selected":"");el.innerHTML=`<div class="avatar">${avatar(u.nickname)}</div><div class="uinfo"><b>${escapeHtml(u.nickname)}</b><small>Available</small></div>`;el.onclick=()=>openChat(u);usersEl.appendChild(el)})}
function escapeHtml(s){return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
async function loadUsers(){const snap=await getDocs(collection(db,"users"));renderUsers(snap.docs.map(x=>x.data()))}
function chatId(a,b){return [a,b].sort().join("_")}
function openChat(user){selected=user;document.getElementById("title").textContent=user.nickname;document.getElementById("chatTab").classList.add("active");document.getElementById("mediaTab").classList.remove("active");document.getElementById("chatView").style.display="flex";document.getElementById("mediaView").style.display="none";document.getElementById("refreshMedia").style.display="none";loadUsers();if(unsubscribeMessages)unsubscribeMessages();messagesEl.innerHTML="<div class='empty'>Loading messages…</div>";const q=query(collection(db,"chats",chatId(uid,user.uid),"messages"),orderBy("createdAt","asc"));unsubscribeMessages=onSnapshot(q,snap=>{messagesEl.innerHTML="";if(snap.empty){messagesEl.innerHTML="<div class='empty'>No messages yet. Say hello 👋</div>";return}snap.forEach(x=>{const m=x.data(),b=document.createElement("div");b.className="bubble"+(m.sender===uid?" mine":"");b.innerHTML=`${escapeHtml(m.text)}<small>${escapeHtml(m.senderName||"")}</small>`;messagesEl.appendChild(b)});messagesEl.scrollTop=messagesEl.scrollHeight},e=>{console.error(e);messagesEl.innerHTML="<div class='empty'>Could not load messages. Check Firestore rules.</div>"})}
async function send(){if(!selected)return alert("Select someone first.");const text=input.value.trim();if(!text)return;input.value="";const id=chatId(uid,selected.uid);await setDoc(doc(db,"chats",id),{members:[uid,selected.uid],updatedAt:serverTimestamp()},{merge:true});await addDoc(collection(db,"chats",id,"messages"),{text,sender:uid,senderName:nickname,createdAt:serverTimestamp()})}
document.getElementById("send").onclick=send;input.onkeydown=e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();send()}};
document.getElementById("logout").onclick=()=>{localStorage.clear();location.href="index.html"};
document.getElementById("menu").onclick=()=>document.getElementById("sidebar").classList.toggle("open");
async function loadMedia(){const g=document.getElementById("gallery");g.innerHTML="<div class='empty'>Loading media…</div>";try{const r=await fetch("https://api.github.com/repos/Iammdtanvirrahman2007/note.com/contents/media?ref=main");if(!r.ok)throw new Error("media folder missing");const files=await r.json();const images=files.filter(f=>f.type==="file"&&/\.(png|jpe?g|gif|webp|bmp|svg)$/i.test(f.name));g.innerHTML="";if(!images.length){g.innerHTML="<div class='empty'>No images yet. Put images inside media/ on GitHub.</div>";return}images.forEach(f=>{const card=document.createElement("div");card.className="photo";const img=document.createElement("img");img.loading="lazy";img.src=`https://raw.githubusercontent.com/Iammdtanvirrahman2007/note.com/main/media/${encodeURIComponent(f.name)}`;img.alt=f.name;const name=document.createElement("div");name.textContent=f.name;card.append(img,name);g.appendChild(card)})}catch(e){g.innerHTML="<div class='empty'>Create a <b>media</b> folder in the repository and upload images there.</div>"}}
document.getElementById("chatTab").onclick=()=>{document.getElementById("chatTab").classList.add("active");document.getElementById("mediaTab").classList.remove("active");document.getElementById("chatView").style.display="flex";document.getElementById("mediaView").style.display="none";document.getElementById("refreshMedia").style.display="none"};document.getElementById("mediaTab").onclick=()=>{document.getElementById("mediaTab").classList.add("active");document.getElementById("chatTab").classList.remove("active");document.getElementById("chatView").style.display="none";document.getElementById("mediaView").style.display="block";document.getElementById("refreshMedia").style.display="inline-block";loadMedia()};document.getElementById("refreshMedia").onclick=loadMedia;
onAuthStateChanged(auth,async u=>{if(!u){try{await signInAnonymously(auth)}catch(e){console.error(e)}}else{await setDoc(doc(db,"users",u.uid),{nickname,uid:u.uid,lastSeen:serverTimestamp()},{merge:true});loadUsers()}});
</script>
</body>
</html>
